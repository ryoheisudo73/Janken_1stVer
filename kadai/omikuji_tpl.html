<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<script src="js/jquery-2.1.3.min.js"></script>
<link rel="stylesheet" href="css/sample.css">
<title>おみくじ</title>
</head>
<body>

<header>
    <h1>おみくじ</h1>
</header>

<main>
    <ul>
        <li id="pull">おみくじを引く</li>
    </ul>
    <p id="echo"></p>
</main>

<footer>フッター</footer>
<script>
$("#pull").on("click",function(){
    const r = Math.random();
    const n = Math.ceil(r*5);
    console.log(n); //0.000001-0.000009

    if(n==1){
        $("#echo").html("大吉");
    }
    if(n==2){
        $("#echo").html("中吉");
    }
    if(n==3){
        $("#echo").html("小吉");
    }
    if(n==4){
        $("#echo").html("吉");
    }
    if(n==5){
        $("#echo").html("末吉");
    }
});





</script>
</body>
</html>
